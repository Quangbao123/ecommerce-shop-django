{% extends 'base.html' %}

{% block content %}
<div class="col-sm-9">
    <div class="features_items"><!--features_items-->
        <h2 class="title text-center">Manage Products</h2>
        
        <div class="table-responsive cart_info mb-4">
            <table class="table table-condensed table-hover align-middle">
                <thead>
                    <tr class="cart_menu text-center">
                        <td class="image" style="width: 15%;">Image</td>
                        <td class="description" style="width: 40%;">Name</td>
                        <td class="price" style="width: 20%;">Price</td>
                        <td class="total text-center" style="width: 25%;">Action</td>
                    </tr>
                </thead>
                <tbody>
                    {% for product in products %}
                        <tr id='product-row-{{ product.id }}'>
                            <td class="cart_product text-center py-2">
                                <a href="#">
                                    <img src="/media/products/{{ product.image_filenames.0 }}" alt="{{ product.name }}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 4px;" />
                                </a>
                            </td>
                            <td class="cart_description">
                                <h4 class="mb-0"><a href="#" style="color: #696763; font-size: 16px; font-weight: 600;">{{ product.name }}</a></h4>
                            </td>
                            <td class="cart_price">
                                <p style="font-size: 16px; color: #FE980F; font-weight: bold; margin: 0;">${{ product.final_price }}</p>
                            </td>
                            <td class="cart_total text-center">
                                <a href="{% url 'edit_product' product.id %}" class="btn btn-primary btn-sm me-1" style="background-color: #FE980F; border: none; padding: 5px 12px;">Edit</a>
                                <button type="button" data-id='{{ product.id }}' data-url="{% url 'delete_product' product.id %}" class="btn btn-danger btn-sm btn-delete" style="background-color: #e74c3c; border: none; padding: 5px 12px;">Delete</button>
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="4" class="text-center py-4">
                                <p class="text-muted">No products found.</p>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Nút Add chuyển trang -->
        <div class="text-end mb-4">
            <button type="button" id="btn-add" class="btn btn-default" style="background-color: #FE980F; color: #fff; font-weight: bold; padding: 8px 20px; border-radius: 4px;">
                <i class="fa fa-plus"></i> Add New Product
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    const addbtn = document.getElementById('btn-add');
    if (addbtn) {
        addbtn.addEventListener('click', function(){
            window.location.href = "{% url 'add_product' %}";
        });
    }
    $(document).ready(function(){
        $('.btn-delete').click(function(e){
            e.preventDefault();
            const product_id = $(this).data('id');
            const delete_url = $(this).data('url');
            if (confirm('Are you sure?')){
                $.ajax({
                    url: delete_url,
                    type: 'POST',
                    headers: {
                        'X-CSRFToken': "{{ csrf_token }}"
                    },
                    success: function(data){
                        $('#product-row-' + product_id).remove();
                    },
                    error: function(xhr){
                        console.log(xhr.responseJSON.error);
                    }
                })
            }
        })
        
    })
</script>
{% endblock %}
