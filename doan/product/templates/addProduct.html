{% extends 'base.html'%}
{% block style %}
<style>
    small{
        color: red
    }
</style>
{% endblock %}
{% block content %}
<div class="col-sm-9">
    <div class="blog-post-area">
      <h2 class="title text-center">Create New Product</h2>
      <div class="signup-form">
        <!-- sign up form -->
        <h2>Create Product!</h2>
        <form method="POST" id='productAjax' enctype="multipart/form-data">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Name"/>
            <small id='err-name'></small>

		    <input type="number" name="price" placeholder="Price"/>
            <small id='err-price'></small>

            <select name="category" >
                <option value="">Please choose category</option>
                {% for cate in categories %}
                    <option value="{{ cate.id }}"> {{ cate.name }} </option>
                {% endfor %}
            </select>
            <small id='err-category'></small>

            <select name="brand">
                <option value="">Please choose brand</option>
                {% for brand in brands %}
                    <option value="{{ brand.id }}"> {{ brand.name }} </option>
                {% endfor %}
            </select>
            <small id='err-brand'></small>

            <select name="status" id='status'>
                <option value="0">New</option>
                <option value="1">Sale</option>
            </select>

            <div id='sale-input' style="display: none;">
                <input type="text" name="sale" placeholder="0"/>
                <small id='err-sale'></small>
            </div>

            <input type="text" name="company" placeholder="Company Profile"/>
            <small id='err-company'></small>

            <input type="file" multiple name="image"/>
            <small id='err-images'></small>

            <textarea type="text" name="detail" placeholder="Detail"></textarea>
            <small id='err-detail'></small>

            <button type="submit" class="btn btn-default">Create</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
{% block scripts %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            const status = document.getElementById('status');
            const saleInput = document.getElementById('sale-input');
            status.addEventListener('change', function(){
                if(this.value == '1'){
                    saleInput.style.display = 'block';
                }else{
                    saleInput.style.display = 'none';
                }
            });

            $('form#productAjax').on('submit', function(e){
                e.preventDefault();
                const formData = new FormData(this);
                $('form#productAjax small').text('');
                $.ajax({
                    url: "/ecomshop/account/add-product/",
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: {
                        'X-CSRFToken': "{{ csrf_token }}"
                    },
                    success: function(data){
                        if(data.success){
                            alert('Tạo sản phẩm thành công!');
                            $('form#productAjax')[0].reset();
                            $('form#productAjax small').text('');
                            $('#sale-input').hide();
                        }
                    },
                    error: function(xhr){
                        if(xhr.responseJSON && xhr.responseJSON.errors){
                            const errors = xhr.responseJSON.errors;
                            $.each(errors, function(field, message){
                                $('#err-'+field).text(message);
                            });
                        }
                    }
                })
            })
        })
        
    </script>
{% endblock %}
