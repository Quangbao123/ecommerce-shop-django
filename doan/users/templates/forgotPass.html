{% extends 'base.html' %}
{% block content %}
<div class="col-sm-8">
  <div class="login-form">
    <!-- login form -->
    <h2>Forgot Password</h2>
    <form method="POST" enctype="multipart/form-data" action='{% url 'forgot_password' %}'>
        {% csrf_token %}
        <input type="text" name="email" placeholder="Enter Email"/>
        <button type="submit" class="btn btn-default">Send Email</button>
    </form>
  </div>
  <!-- /sign up form -->
</div>
{% endblock %}
